__include__: [
  '/home/featurize/zfy/DEIM/configs/dataset/awps_detection2.yml',
  '../runtime.yml',
  '../base/dataloader_dfine.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]

print_freq: 2000
output_dir: ./outputs/dfine_hgnetv2_s_awps2_p2


DEIM:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [0, 1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 3  # 4 5 6
  eval_idx: -1  # -2 -3 -4
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  num_points: [4, 4, 4, 4] # [4, 4, 4] [3, 6, 3]
  num_levels: 4


HybridEncoder:
  in_channels: [64, 256, 512, 1024]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [180, 240]
  gamma: 0.8

# Increase to search for the optimal ema
epoches: 300 # 120 + 4n
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 240
  collate_fn:
    stop_epoch: 240
    ema_restart_decay: 0.9999
    base_size_repeat: ~
  total_batch_size: 4
val_dataloader:
  total_batch_size: 4