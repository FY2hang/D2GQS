__include__: [
  '/home/featurize/zfy/DEIM/configs/dataset/pl_detection.yml',
  '../runtime.yml',
  '../base/dataloader_dfine.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]

print_freq: 400
output_dir: ./outputs/dfine_hgnetv2_m_pl

remap_mscoco_category: True
model: DEIM_MG

DEIM_MG:
  yaml_path: configs/cfg/dfine-m.yaml

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# Increase to search for the optimal ema
epoches: 300 # 148 + 4n
train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      policy:
        epoch: 278
  collate_fn:
    stop_epoch: 278
    ema_restart_decay: 0.9999
    base_size_repeat: ~

val_dataloader:
  total_batch_size: 16
